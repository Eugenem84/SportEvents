# Продакшен-оверрайд для VPS:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# - поднимает тот же app и postgres,
# - добавляет Caddy: он сам получает HTTPS (Let's Encrypt) и проксирует на app,
# - добавляет restart-политики, чтобы сервисы поднимались после перезагрузки VPS​.
# Локальный запуск этой командой не затрагивается (используется только на сервере）。

services:
  postgres:
    restart: unless-stopped
  app:
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config: